[scrapyd]
# Listen on all interfaces so other containers on the shared Docker network
# (e.g. Airflow) can reach the API at http://scrapyd:6800.
bind_address = 0.0.0.0
http_port    = 6800

# Persist eggs/state/logs/items to these paths (mounted as named volumes in
# docker-compose.yml so deploys and scraped items survive container restarts).
eggs_dir     = /var/lib/scrapyd/eggs
dbs_dir      = /var/lib/scrapyd/dbs
logs_dir     = /var/lib/scrapyd/logs

# items_dir is the important one for the pipeline integration: when set, Scrapyd
# stores each job's scraped items here AND serves them over HTTP at
#   /items/<project>/<spider>/<jobid>.jl
# which is exactly what the Airflow DAG downloads. Leave it set.
items_dir    = /var/lib/scrapyd/items

# Playwright renders a full headless browser per request, so keep crawl
# concurrency modest to stay within the container's memory limits.
max_proc_per_cpu = 2
finished_to_keep = 100
jobs_to_keep     = 50
